name: Build Momo APK for Flint 2

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    name: Compile OpenWrt Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: 'momo-source'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev libc6-dev-i386 \
            xz-utils curl wget jq zstd

      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          
          # Скачиваем файл с хешами отдельно
          wget -qO sha256sums "${BASE_URL}/sha256sums"
          
          # Извлекаем точное имя файла SDK
          SDK_FILE=$(grep "openwrt-sdk" sha256sums | head -n 1 | awk '{print $2}' | sed 's/^\*//')
          
          echo "Downloading SDK: ${SDK_FILE}"
          wget -qO sdk.tar.zst "${BASE_URL}/${SDK_FILE}"
          
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Configure Feeds & Compile
        run: |
          cd openwrt-sdk
          
          echo "src-link custommomo ${GITHUB_WORKSPACE}/momo-source" >> feeds.conf.default
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a -p custommomo
          ./scripts/feeds install -a
          
          make defconfig
          
          make package/momo/compile V=s
          make package/luci-app-momo/compile V=s
          make package/luci-i18n-momo-zh-cn/compile V=s || true

      - name: Collect Packages
        run: |
          mkdir -p package-artifacts
          find openwrt-sdk/bin/packages/ -type f -name "*momo*.apk" -exec cp {} package-artifacts/ \;
          find openwrt-sdk/bin/packages/ -type f -name "*momo*.ipk" -exec cp {} package-artifacts/ \;


      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: momo-gl-mt6000-packages
          path: package-artifacts/*
