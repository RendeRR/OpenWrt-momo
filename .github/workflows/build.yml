name: Build Momo APK for Flint 2

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Права для создания релизов и пуша в ветку gh-pages
permissions:
  contents: write

jobs:
  build:
    name: Compile OpenWrt Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: 'momo-source'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev libc6-dev-i386 \
            xz-utils curl wget jq zstd

      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          
          # Скачиваем файл с хешами
          wget -qO sha256sums "${BASE_URL}/sha256sums"
          
          # Извлекаем точное имя файла SDK
          SDK_FILE=$(grep "openwrt-sdk" sha256sums | head -n 1 | awk '{print $2}' | sed 's/^\*//')
          
          echo "Downloading SDK: ${SDK_FILE}"
          wget -qO sdk.tar.zst "${BASE_URL}/${SDK_FILE}"
          
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Setup Key, Feeds & Compile
        run: |
          cd openwrt-sdk
          
          # Правильно записываем многострочный приватный ключ ECDSA с сохранением переносов
          cat << 'EOF' > key-build
          ${{ secrets.FEED_KEY }}
          EOF
          
          # Подкладываем публичный ключ из корня репозитория
          cp ${GITHUB_WORKSPACE}/momo-source/custom-feed.pem key-build.pub
          
          echo "src-link custommomo ${GITHUB_WORKSPACE}/momo-source" >> feeds.conf.default
          
          ./scripts/feeds update -a
          
          # Устанавливаем пакеты только из кастомного фида
          ./scripts/feeds install -a -p custommomo
          
          make defconfig
          
          # Собираем целевые пакеты в многопоточном режиме
          make package/momo/compile -j$(nproc) V=s
          make package/luci-app-momo/compile -j$(nproc) V=s
          make package/luci-i18n-momo-zh-cn/compile -j$(nproc) V=s || true
    
      - name: Generate Feed Index
        run: |
          cd openwrt-sdk
          
          # Явно заставляем SDK подписать индекс нашим приватным ключом
          make package/index V=s CONFIG_SIGN_SIGNATURE="${GITHUB_WORKSPACE}/openwrt-sdk/key-build"
          
          # Копируем публичный ключ в фид для публикации на Pages
          cp key-build.pub bin/packages/custom-feed.pem

      - name: Collect Packages for Release
        run: |
          mkdir -p package-artifacts
          # Собираем только файлы, в названии которых есть momo, для прикрепления к релизу
          find openwrt-sdk/bin/packages/ -type f -name "*momo*.apk" -exec cp {} package-artifacts/ \;
          find openwrt-sdk/bin/packages/ -type f -name "*momo*.ipk" -exec cp {} package-artifacts/ \;

      - name: Generate Release Tag
        run: echo "RELEASE_TAG=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Momo Auto-Build ${{ env.RELEASE_TAG }}
          files: package-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages (Feed)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./openwrt-sdk/bin/packages/
          keep_files: false
