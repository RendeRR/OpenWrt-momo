name: Build Momo APK for Flint 2

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - 'README.zh.md'
      - 'LICENSE'
      - 'images/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momo-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile OpenWrt Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: momo-source
          fetch-depth: 1

      - name: Validate Feed Signing Key
        run: |
          set -euo pipefail

          if [[ -z "${FEED_KEY:-}" ]]; then
            echo "FEED_KEY secret is missing."
            exit 1
          fi

          umask 077
          KEY_PATH="${RUNNER_TEMP}/key-build.pem"
          printf '%s\n' "${FEED_KEY}" > "${KEY_PATH}"
          unset FEED_KEY

          test -s "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem"

          openssl pkey -in "${KEY_PATH}" -check -noout
          openssl pkey -in "${KEY_PATH}" -pubout -out "${RUNNER_TEMP}/derived-public.pem"

          EXPECTED_KEY="$(
            openssl pkey -pubin \
              -in "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" \
              -outform DER | sha256sum | awk '{print $1}'
          )"

          DERIVED_KEY="$(
            openssl pkey -pubin -in "${RUNNER_TEMP}/derived-public.pem" \
              -outform DER | sha256sum | awk '{print $1}'
          )"

          rm -f "${RUNNER_TEMP}/derived-public.pem"

          if [[ "${EXPECTED_KEY}" != "${DERIVED_KEY}" ]]; then
            echo "Public and private feed keys do not match."
            exit 1
          fi

          echo "SIGNING_KEY=${KEY_PATH}" >> "$GITHUB_ENV"
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}

      - name: Setup Host Tools
        run: |
          set -euo pipefail

          REQUIRED_PKGS=(
            aria2 build-essential gawk gettext git
            libncurses-dev python3 rsync tree unzip wget xz-utils zstd
          )
          MISSING_PKGS=()
          for pkg in "${REQUIRED_PKGS[@]}"; do
            if ! dpkg-query -W -f='${Status}' "${pkg}" 2>/dev/null | grep -q "install ok installed"; then
              MISSING_PKGS+=("${pkg}")
            fi
          done

          if [[ ${#MISSING_PKGS[@]} -gt 0 ]]; then
            echo "Installing missing packages: ${MISSING_PKGS[*]}"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${MISSING_PKGS[@]}"
          fi

      - name: Download and Extract OpenWrt SDK
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          wget -q -t 3 --timeout=15 -O sha256sums "${BASE_URL}/sha256sums"

          SDK_FILE="$(
            awk '
              $2 ~ /openwrt-sdk/ && $2 ~ /Linux-x86_64\.tar\.zst$/ {
                gsub(/^\*/, "", $2)
                print $2
                exit
              }
            ' sha256sums
          )"

          if [[ -z "${SDK_FILE}" ]]; then
            echo "OpenWrt SDK archive not found."
            exit 1
          fi

          EXPECTED_SHA="$(
            awk -v f="${SDK_FILE}" '$2 == f || $2 == "*" f {print $1; exit}' sha256sums
          )"
          rm -f sha256sums

          if [[ -z "${EXPECTED_SHA}" ]]; then
            echo "OpenWrt SDK sha256 not found."
            exit 1
          fi

          echo "Downloading SDK: ${SDK_FILE}"
          aria2c -x16 -s16 -k1M --retry-wait=3 -m 3 --console-log-level=warn \
            -d . -o sdk.tar.zst "${BASE_URL}/${SDK_FILE}" \
            || wget -q "${BASE_URL}/${SDK_FILE}" -O sdk.tar.zst

          ACTUAL_SHA="$(sha256sum sdk.tar.zst | awk '{print $1}')"
          if [[ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "SDK checksum verification failed: expected ${EXPECTED_SHA}, got ${ACTUAL_SHA}."
            exit 1
          fi

          mkdir -p openwrt-sdk
          zstd -T0 -dc sdk.tar.zst | tar -x --strip-components=1 -C openwrt-sdk
          rm -f sdk.tar.zst

      - name: Prepare Minimal Feeds and Config
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail

          # Extract exact LuCI commit/branch from SDK's feeds.conf.default and
          # sparse-checkout ONLY luci.mk + modules/luci-base (~3s instead of scanning 2400+ Makefiles).
          LUCI_SPEC="$(awk '$2 == "luci" {print $3; exit}' feeds.conf.default)"
          LUCI_REF="HEAD"
          if [[ "${LUCI_SPEC}" == *"^"* ]]; then
            LUCI_REF="${LUCI_SPEC##*^}"
          elif [[ "${LUCI_SPEC}" == *";"* ]]; then
            LUCI_REF="${LUCI_SPEC##*;}"
          fi

          LUCI_SPARSE="${RUNNER_TEMP}/luci-sparse"
          rm -rf "${LUCI_SPARSE}"
          git init -q "${LUCI_SPARSE}"
          git -C "${LUCI_SPARSE}" remote add origin https://github.com/openwrt/luci.git
          git -C "${LUCI_SPARSE}" sparse-checkout set --no-cone \
            '/luci.mk' '/LICENSE' '/NOTICE' '/modules/luci-base/**'
          git -C "${LUCI_SPARSE}" fetch -q --depth 1 --filter=blob:none origin "${LUCI_REF}"
          git -C "${LUCI_SPARSE}" -c advice.detachedHead=false checkout -q FETCH_HEAD

          cat > feeds.conf <<EOF
          src-link luci ${LUCI_SPARSE}
          src-link custommomo ${GITHUB_WORKSPACE}/momo-source
          EOF

          ./scripts/feeds update luci custommomo
          ./scripts/feeds install -p luci luci-base
          ./scripts/feeds install -a -p custommomo

          make defconfig

          sed -i -E 's/^(CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED))=y/# \1 is not set/' .config

          cat >> .config <<'EOF'
          CONFIG_SIGNED_PACKAGES=y
          CONFIG_PACKAGE_momo=m
          CONFIG_PACKAGE_luci-app-momo=m
          EOF

          make defconfig

          grep -q '^CONFIG_PACKAGE_momo=m' .config
          grep -q '^CONFIG_PACKAGE_luci-app-momo=m' .config

      - name: Compile Momo Packages (NO_DEPS)
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail

          PUB_KEY="${GITHUB_WORKSPACE}/openwrt-sdk/public-key.pem"
          cp -f "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" "${PUB_KEY}"
          cp -f "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" key-build.pub
          mkdir -p staging_dir/hostpkg/bin staging_dir/hostpkg/stamp

          # Build only standalone host helpers (jsmin + po2lmo, <1s)
          make package/feeds/luci/luci-base/host/compile NO_DEPS=1 -j"$(nproc)"
          test -x staging_dir/hostpkg/bin/jsmin
          test -x staging_dir/hostpkg/bin/po2lmo

          # Package momo and luci-app-momo directly without compiling C runtime dependencies
          TARGETS="package/momo/compile package/luci-app-momo/compile"
          make ${TARGETS} NO_DEPS=1 -j"$(nproc)" \
            BUILD_KEY_APK_SEC="${SIGNING_KEY}" \
            BUILD_KEY_APK_PUB="${PUB_KEY}" \
            || make ${TARGETS} NO_DEPS=1 -j1 V=s \
              BUILD_KEY_APK_SEC="${SIGNING_KEY}" \
              BUILD_KEY_APK_PUB="${PUB_KEY}"

          make package/index \
            BUILD_KEY_APK_SEC="${SIGNING_KEY}" \
            BUILD_KEY_APK_PUB="${PUB_KEY}"

      - name: Verify Metadata and Collect Artifacts
        run: |
          set -euo pipefail

          ADB_FILES=(openwrt-sdk/bin/packages/*/custommomo/packages.adb)
          if [[ ${#ADB_FILES[@]} -ne 1 || ! -s "${ADB_FILES[0]}" ]]; then
            echo "Expected signed packages.adb not found."
            exit 1
          fi

          # Verify APK metadata and runtime dependencies inside packages.adb
          openwrt-sdk/staging_dir/host/bin/apk adbdump --format json "${ADB_FILES[0]}" \
            | python3 -c '
          import json, sys

          data = json.load(sys.stdin)
          pkgs = {p["name"]: set(p.get("depends", [])) for p in data.get("packages", [])}

          expected = {
              "momo": {
                  "ca-bundle", "curl", "firewall4", "ip-full",
                  "kmod-inet-diag", "kmod-nft-socket", "kmod-nft-tproxy",
                  "kmod-tun", "kmod-dummy",
              },
              "luci-app-momo": {"luci-base", "momo"},
          }

          for name, req_deps in expected.items():
              if name not in pkgs:
                  raise SystemExit(f"Missing package in packages.adb: {name}")
              actual_names = {d.split("=")[0].split("<")[0].split(">")[0].split("~")[0] for d in pkgs[name]}
              missing = req_deps - actual_names
              if missing:
                  raise SystemExit(f"{name} is missing dependencies: {sorted(missing)} (got {sorted(pkgs[name])})")
              print(f"Verified {name} dependencies: {sorted(pkgs[name])}")
          '

          mkdir -p package-artifacts site

          find openwrt-sdk/bin/packages/ -type f \
            \( -name 'momo-*.apk' -o -name 'luci-app-momo-*.apk' \
               -o -name 'momo-*.ipk' -o -name 'luci-app-momo-*.ipk' \) \
            -exec cp -f {} package-artifacts/ \;

          for package in momo luci-app-momo; do
            if ! find package-artifacts -maxdepth 1 -type f \
              \( -name "${package}-*.apk" -o -name "${package}-*.ipk" \) \
              | grep -q .; then
              echo "Required package not found: ${package}"
              exit 1
            fi
          done

          echo "Built packages:"
          ls -lh package-artifacts/

          for dir in openwrt-sdk/bin/packages/*/custommomo; do
            arch="$(basename "$(dirname "${dir}")")"
            mkdir -p "site/${arch}"
            cp -a "${dir}" "site/${arch}/"
          done
          cp "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" site/custom-feed.pem

          (
            cd site
            BASE="/${GITHUB_REPOSITORY#*/}"

            tree -H "${BASE}" -T "Momo's Feed" --noreport --charset utf-8 \
              -I "index.html|*.json" -o index.html

            sed -i "s|${BASE}\./|${BASE}/|g" index.html
            sed -i '/<a href="[^"]*">\.<\/a><br>/d' index.html
            sed -i 's|</head>|<style>hr, .VERSION { display: none; }</style></head>|' index.html
          )

          find site -maxdepth 3 | sort

      - name: Cleanup Signing Key
        if: always()
        run: rm -f "${RUNNER_TEMP}/key-build.pem"

      - name: Generate Release Tag
        run: |
          echo "RELEASE_TAG=build-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Momo Auto-Build ${{ env.RELEASE_TAG }}
          files: package-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
