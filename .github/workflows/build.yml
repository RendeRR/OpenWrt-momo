name: Build Momo APK for Flint 2

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momo-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile OpenWrt Packages
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: momo-source
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential gawk gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip wget xz-utils zlib1g-dev zstd

      - name: Download OpenWrt SDK
        id: sdk
        run: |
          set -euo pipefail

          BASE_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"

          wget -qO sha256sums "${BASE_URL}/sha256sums"

          SDK_FILE="$(
            awk '
              $2 ~ /openwrt-sdk/ && $2 ~ /Linux-x86_64\.tar\.zst$/ {
                gsub(/^\*/, "", $2)
                print $2
                exit
              }
            ' sha256sums
          )"

          if [[ -z "${SDK_FILE}" ]]; then
            echo "OpenWrt SDK archive not found."
            exit 1
          fi

          EXPECTED_SHA="$(
            awk -v f="${SDK_FILE}" '$2 == f || $2 == "*" f {print $1; exit}' sha256sums
          )"

          echo "Downloading SDK: ${SDK_FILE}"
          wget -q "${BASE_URL}/${SDK_FILE}" -O sdk.tar.zst

          ACTUAL_SHA="$(sha256sum sdk.tar.zst | awk '{print $1}')"

          if [[ -z "${EXPECTED_SHA}" || "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]]; then
            echo "SDK checksum verification failed."
            exit 1
          fi

          mkdir -p openwrt-sdk
          zstd -dc sdk.tar.zst | tar -x --strip-components=1 -C openwrt-sdk
          rm -f sdk.tar.zst

          test -x openwrt-sdk/scripts/feeds

          echo "sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Key, Feeds and Configuration
        working-directory: openwrt-sdk
        env:
          FEED_KEY: ${{ secrets.FEED_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${FEED_KEY:-}" ]]; then
            echo "FEED_KEY secret is missing."
            exit 1
          fi

          umask 022

          printf '%s\n' "${FEED_KEY}" > key-build.pem
          chmod 600 key-build.pem
          unset FEED_KEY

          test -s "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem"
          cp "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" key-build.pub

          openssl pkey -in key-build.pem -check -noout
          openssl pkey -in key-build.pem -pubout -out derived-public.pem

          EXPECTED_KEY="$(
            openssl pkey -pubin \
              -in "${GITHUB_WORKSPACE}/momo-source/custom-feed.pem" \
              -outform DER | sha256sum | awk '{print $1}'
          )"

          DERIVED_KEY="$(
            openssl pkey -pubin -in derived-public.pem \
              -outform DER | sha256sum | awk '{print $1}'
          )"

          if [[ "${EXPECTED_KEY}" != "${DERIVED_KEY}" ]]; then
            echo "Public and private feed keys do not match."
            exit 1
          fi

          rm -f derived-public.pem

          echo "src-link custommomo ${GITHUB_WORKSPACE}/momo-source" \
            >> feeds.conf.default

          # Only the feeds we actually need (base: zlib/mbedtls/firewall4/iproute2,
          # packages: golang + curl + deps, luci: luci.mk/luci-base)
          ./scripts/feeds update base packages luci custommomo
          ./scripts/feeds install -a -p custommomo

          # The SDK ships without .config: generate the default one first.
          make defconfig

          # Build only the selected packages and their dependencies
          # (no extra iproute2 variants, unrelated kmods, i18n, etc.).
          # If a dependency ever fails to build, delete this sed line.
          sed -i -E 's/^(CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED))=y/# \1 is not set/' .config

          cat >> .config <<'EOF'
          CONFIG_SIGNED_PACKAGES=y
          CONFIG_PACKAGE_momo=m
          CONFIG_PACKAGE_luci-app-momo=m
          EOF

          make defconfig

          grep -q '^CONFIG_PACKAGE_momo=m' .config
          grep -q '^CONFIG_PACKAGE_luci-app-momo=m' .config

          # momo's declared dependencies must stay selected after trimming
          # (fail in seconds here instead of minutes into the build).
          for pkg in ca-bundle curl firewall4 ip-full \
                     kmod-inet-diag kmod-nft-socket kmod-nft-tproxy kmod-tun; do
            grep -Eq "^CONFIG_PACKAGE_${pkg}=[my]" .config \
              || { echo "Dependency not selected: ${pkg}"; exit 1; }
          done

      # Downloaded sources (Go modules etc.) are content-addressed, so a
      # stale cache is safe: restore-keys fall back to the latest one.
      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: openwrt-sdk/dl
          key: openwrt-dl-${{ hashFiles('momo-source/**/Makefile') }}
          restore-keys: |
            openwrt-dl-

      - name: Compile Momo Packages
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail

          TARGETS="package/momo/compile package/luci-app-momo/compile"
          KEY="${GITHUB_WORKSPACE}/openwrt-sdk/key-build.pem"

          # Quiet parallel build; on failure re-run single-threaded and verbose
          # so the actual error is easy to find in the log.
          make ${TARGETS} -j"$(nproc)" BUILD_KEY_APK_SEC="${KEY}" \
            || make ${TARGETS} -j1 V=s BUILD_KEY_APK_SEC="${KEY}"

      - name: Generate Feed Index
        working-directory: openwrt-sdk
        run: |
          set -euo pipefail

          make package/index BUILD_KEY_APK_SEC="${GITHUB_WORKSPACE}/openwrt-sdk/key-build.pem"

          ls bin/packages/*/custommomo/packages.adb
          test -s bin/packages/*/custommomo/packages.adb

      - name: Collect and Validate Packages
        run: |
          set -euo pipefail

          mkdir -p package-artifacts

          find openwrt-sdk/bin/packages/ -type f \
            \( -name 'momo-*.apk' -o -name 'luci-app-momo-*.apk' \
               -o -name 'momo-*.ipk' -o -name 'luci-app-momo-*.ipk' \) \
            -exec cp -f {} package-artifacts/ \;

          for package in momo luci-app-momo; do
            if ! find package-artifacts -maxdepth 1 -type f \
              \( -name "${package}-*.apk" -o -name "${package}-*.ipk" \) \
              | grep -q .; then
              echo "Required package not found: ${package}"
              exit 1
            fi
          done

          echo "Built packages:"
          ls -lh package-artifacts/

      # Publish only our own feed (not luci/base/packages built as dependencies),
      # keeping the same <arch>/custommomo/ layout on gh-pages.
      - name: Prepare GitHub Pages content
        run: |
          set -euo pipefail

          mkdir -p site
          for dir in openwrt-sdk/bin/packages/*/custommomo; do
            arch="$(basename "$(dirname "${dir}")")"
            mkdir -p "site/${arch}"
            cp -a "${dir}" "site/${arch}/"
          done
          cp openwrt-sdk/key-build.pub site/custom-feed.pem

          find site -maxdepth 3 | sort

      - name: Generate Release Tag
        run: |
          echo "RELEASE_TAG=build-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Momo Auto-Build ${{ env.RELEASE_TAG }}
          files: package-artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
