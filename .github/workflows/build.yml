name: Build Momo APK for Flint 2

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    name: Compile OpenWrt Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: 'momo-source'

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev libc6-dev-i386 \
            xz-utils curl wget jq zstd

      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
          SDK_FILE=$(curl -s$BASE_URL/sha256sums | grep "openwrt-sdk" | head -n 1 | awk '{print $2}' | sed 's/^\*//')
          
          echo "Downloading SDK: $SDK_FILE"
          wget -qO sdk.tar.zst "$BASE_URL/$SDK_FILE"
          
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Configure Feeds & Compile
        run: |
          cd openwrt-
          
